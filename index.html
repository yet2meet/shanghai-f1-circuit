<body>
  <!-- 微信内置浏览器分享时会取页面里的第一张图片作为缩略图 -->
  <div style="display:none"><img src="./apple-touch-icon.png" alt="" /></div>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <header class="brand glass" id="brand">
    <div class="brand-mark" role="img" aria-label="Formula 1"><span></span></div>
    <div>
      <h1><span class="b-long" data-i18n="brandName">上海国际赛车场</span><span class="b-short" data-i18n="brandShort">上海国际赛车场</span></h1>
      <p data-i18n="brandSub">Shanghai International Circuit · 5.451 km · 16 弯</p>
    </div>
  </header>

  <div class="top-right">
    <div class="segmented glass lang-seg" id="langSeg" role="tablist" data-i18n-aria="langLabel" aria-label="语言">
      <div class="seg-thumb"></div>
      <button data-lang="zh" class="on" role="tab">中</button>
      <button data-lang="en" role="tab">EN</button>
    </div>
    <div class="segmented glass" id="themeSeg" role="tablist" data-i18n-aria="dayNight" aria-label="昼夜模式">
      <div class="seg-thumb"></div>
      <button data-mode="day" class="on" role="tab">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>
        <span data-i18n="day">白天</span>
      </button>
      <button data-mode="night" role="tab">
        <svg viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z"/></svg>
        <span data-i18n="night">黑夜</span>
      </button>
    </div>
  </div>

  <nav class="pills" id="pills">
    <button id="pillList" class="pill glass" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 18h16M6 14h12M8 10h8M10 6h4"/></svg><span data-i18n="pillList">看台与票价</span><i class="chev"></i></button>
    <button id="pillInfo" class="pill glass" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/></svg><span data-i18n="pillInfo">赛道信息</span><i class="chev"></i></button>
    <button id="pillSat" class="pill glass" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7l5-2.5 6 3 5-2.5v12.5l-5 2.5-6-3-5 2.5z"/><path d="M9 4.5v12.5M15 7.5V20"/></svg><span data-i18n="pillSat">卫星图</span></button>
  </nav>
  <div id="satCredit" class="sat-credit"></div>
  <aside class="panel info glass" id="info"></aside>
  <aside class="panel left glass" id="list">
    <div class="panel-head">
      <h2 data-i18n="listTitle">看台与票价</h2>
      <span class="muted" data-i18n="listSub">三日票 · 人民币</span>
    </div>

  </aside>

  <aside class="panel right glass hidden" id="detail"></aside>

  <div class="minimap glass" id="minimap"></div>

  <nav class="dock glass">
    <button id="zoomOut" title="缩小" aria-label="缩小" data-i18n-title="zoomOut" data-i18n-aria="zoomOut"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoomIn" title="放大" aria-label="放大" data-i18n-title="zoomIn" data-i18n-aria="zoomIn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <i></i>
    <button id="home" class="wide" title="回到全景" data-i18n-title="homeTitle"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5M6.5 10v8.5h11V10"/></svg><span data-i18n="home">全景</span></button>
  </nav>

  <a class="osm-credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" data-i18n="osm">© OpenStreetMap 贡献者</a>

  <div id="tooltip" class="glass"></div>
  <div id="toast" class="glass"></div>

  <div id="splash">
    <canvas></canvas>
    <div class="sp-top">
      <div class="brand-mark" role="img" aria-label="Formula 1"><span></span></div>
      <h1 data-i18n="brandName">上海国际赛车场</h1>

      <div class="sp-bar"><i></i></div>
      <div class="sp-credit">© 2026 yet2meet</div>
    </div>
  </div>
